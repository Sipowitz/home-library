services:
  db:
    image: postgres:15
    container_name: library_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: library

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: library_backend
    restart: always

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8001:8000"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/library
      SECRET_KEY: super-secure-production-key-123

    volumes:
      - /srv/dev-disk-by-uuid-43d92b4b-6f5d-4851-bd58-48f90f1d2259/Docker/DockerData/development/workspace/Apps/Library-App/backend:/app
      - /srv/dev-disk-by-uuid-43d92b4b-6f5d-4851-bd58-48f90f1d2259/Docker/DockerData/development/workspace/Apps/Library-App/backend/covers:/app/covers

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

volumes:
  postgres_data:
